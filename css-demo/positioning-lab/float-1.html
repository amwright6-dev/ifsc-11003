<!DOCTYPE html>
<html lang="en">

<head>
    <style type="text/css">

/* ---------------Box Sizing----------------- */
html {
  box-sizing: border-box;
}
*,
*:before,
*:after {
  box-sizing: inherit;
}
body {
  background-color: #ececec;
  font-weight: bold;
  font-family: Tahoma, Geneva, sans-serif;
  color: #fff;
  text-align: center;
  line-height: 24px;
}
#wrapper {
  background-color: #fff;
  border: 1px solid #c0c0c0;
  width: 800px;
  margin-right: auto;
  margin-left: auto;
  text-shadow: 2px 2px #000;
}
#navy {
  background-color: #001f3f;
      width:370px;
  height:150px;
  float:left;
}
#teal {
  background-color: #39cccc;
      width:370px;
  height:150px;
  float:lright;
}
#blue {
  background-color: #0074d9;
      width:370px;
  height:150px;
}
#aqua {
  background-color: #7fdbff;
      width:370px;
  height:150px;
}
#footer {
  background-color: #666;
}
h1 {
  color: #000;
  font-weight: normal;
  padding: 50px;
}
</style>
</head>
<body>
  <h1>Exercise</h1>
  <section id="wrapper">
    <div id="navy">Navy</div>
    <div id="teal">Teal</div>
    <div id="blue">Blue</div>
    <div id="aqua">Aqua</div>
    <div id="footer">Footer</div>
  </section>
</body>

</html>
